<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>麦克斯坦 - AI 产品作品集</title>
  <meta name="description" content="麦克斯坦的 AI 产品作品集，展示个人产品、工具和创作项目。">
  <meta property="og:title" content="麦克斯坦 - AI 产品作品集">
  <meta property="og:description" content="查看麦克斯坦的 AI 产品、工具和创作项目。">
  <meta property="og:type" content="website">
  <style>
    :root {
      --paper: #030504;
      --ink: #e8ebe5;
      --green: #56ff8b;
      --muted: rgba(232, 235, 229, .46);
      --line: rgba(86, 255, 139, .24);
      --card-bg: rgba(255, 255, 255, .04);
      --card-border: rgba(86, 255, 139, .12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      min-height: 100vh;
      padding-top: 60px;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .05;
      background-image:
        radial-gradient(circle at 50% 20%, rgba(86, 255, 139, .08), transparent 40%),
        linear-gradient(rgba(86, 255, 139, .15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(86, 255, 139, .10) 1px, transparent 1px);
      background-size: 60px 60px;
      background-position: 0 1px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 17px;
      font-weight: 500;
      color: var(--green);
      text-shadow: 0 0 16px rgba(86, 255, 139, .24);
      text-transform: uppercase;
      line-height: 1;
    }

    .nav-tab {
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: rgba(232, 235, 229, .52);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      transition: color .2s ease;
    }

    .nav-tab.is-active {
      color: var(--green);
    }

    .hero {
      padding: 48px 20px 36px;
      text-align: center;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 200;
      line-height: 1.3;
      color: rgba(232, 235, 229, .92);
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .hero p {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    .section-title {
      padding: 0 20px;
      margin-bottom: 16px;
      font-size: 12px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: rgba(86, 255, 139, .62);
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 16px 32px;
    }

    .product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card-bg);
      overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .product-card:active {
      border-color: rgba(86, 255, 139, .36);
      box-shadow: 0 0 24px rgba(86, 255, 139, .08);
    }

    .product-card-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-bottom: 1px solid var(--card-border);
    }

    .product-card-placeholder {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      border-bottom: 1px solid var(--card-border);
      background: linear-gradient(145deg, var(--placeholder-a), var(--placeholder-b));
    }

    .product-card-placeholder span {
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 300;
      color: rgba(255, 255, 255, .72);
    }

    .product-card-body {
      padding: 16px 18px 18px;
    }

    .product-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .product-card-title {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.2;
      color: rgba(232, 235, 229, .94);
    }

    .product-card-status {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(86, 255, 139, .24);
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
      color: rgba(86, 255, 139, .78);
      white-space: nowrap;
    }

    .product-card-summary {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: rgba(3, 5, 4, .94);
      backdrop-filter: blur(24px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .detail-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(3, 5, 4, .9);
      backdrop-filter: blur(16px);
    }

    .detail-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .detail-back::before {
      content: "←";
      font-size: 16px;
    }

    .detail-nav-btn {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }

    .detail-nav-btn:active {
      color: var(--green);
      border-color: rgba(86, 255, 139, .4);
    }

    .detail-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 52vh;
      object-fit: cover;
      border-bottom: 1px solid var(--card-border);
    }

    .detail-content {
      padding: 24px 22px 40px;
    }

    .detail-status {
      display: inline-flex;
      align-items: center;
      height: 22px;
      margin-bottom: 12px;
      padding: 0 8px;
      border: 1px solid rgba(86, 255, 139, .28);
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(86, 255, 139, .82);
    }

    .detail-title {
      font-size: 32px;
      font-weight: 200;
      line-height: 1.1;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .94);
      margin-bottom: 20px;
    }

    .detail-description {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255, 255, 255, .82);
      white-space: pre-line;
    }

    .detail-signature {
      margin-top: 20px;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 15px;
      font-weight: 300;
      color: rgba(86, 255, 139, .72);
    }

    .detail-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      min-width: 140px;
      height: 44px;
      padding: 0 20px;
      border: 1px solid rgba(86, 255, 139, .44);
      border-radius: 999px;
      background: rgba(86, 255, 139, .10);
      color: rgba(232, 235, 229, .92);
      font-size: 14px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background .2s ease;
    }

    .detail-cta:active {
      background: rgba(86, 255, 139, .2);
    }

    .detail-cta.hidden {
      display: none;
    }

    .about-section {
      padding: 32px 22px 48px;
    }

    .about-section h2 {
      font-size: 24px;
      font-weight: 200;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .94);
      margin-bottom: 20px;
    }

    .about-section p {
      font-size: 15px;
      line-height: 2;
      color: rgba(255, 255, 255, .82);
      white-space: pre-line;
    }

    .about-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: rgba(3, 5, 4, .96);
      backdrop-filter: blur(24px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .about-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">麦克斯坦</div>
    <button class="nav-tab" id="aboutTab" type="button">关于我</button>
  </div>

  <section class="hero">
    <h1>AI 产品作品集</h1>
    <p>点击卡片查看产品详情</p>
  </section>

  <div class="section-title">作品</div>
  <div class="products" id="productList"></div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-header">
      <button class="detail-back" id="detailBack" type="button">返回</button>
      <button class="detail-nav-btn" id="detailNext" type="button">下一个 →</button>
    </div>
    <img class="detail-image" id="detailImage" alt="">
    <div class="detail-content">
      <div class="detail-status" id="detailStatus"></div>
      <h2 class="detail-title" id="detailTitle"></h2>
      <p class="detail-description" id="detailDescription"></p>
      <div class="detail-signature" id="detailSignature"></div>
      <a class="detail-cta hidden" id="detailCta" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <div class="about-overlay" id="aboutOverlay">
    <div class="detail-header">
      <button class="detail-back" id="aboutBack" type="button">返回</button>
    </div>
    <div class="about-section">
      <h2>关于我</h2>
      <p id="aboutContent"></p>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      {
        title: 'KnowLens',
        status: 'live',
        description: '我是照向长文本深处的一枚镜片。视频、PDF、网页或一段粘贴而来的文字，都可以在我这里沉淀为可追溯的知识点。每一次摘录都连回原文，每一次洞察都不离开证据，却试着走得更远。我的使命不是替你总结，而是陪你真正读懂：看见一句话背后的逻辑、趋势，以及它与你自身经验之间的连接。',
        signature: '@knowlens',
        summary: '从长文本中提炼可追溯的知识洞察。',
        ctaLabel: '查看产品',
        ctaUrl: 'https://knowlens.mikestan.cn/',
        image: 'assets/portfolio/knowlens图片.png'
      },
      {
        title: '奶咖记',
        status: 'live',
        description: '我是一册写给杯子的日记，也是一面温柔的镜子。你只需拍下今天的奶茶或咖啡，便替你记住它的名字、糖分、热量、咖啡因与花费。日子会在日历里慢慢显影，月度与年度报告像展墙一样展开你的习惯：不催促改变，只让每一次入口的甜、苦、清醒与犒赏，都变得有迹可循。',
        signature: '@奶咖记 小程序',
        summary: '记录每一杯奶茶咖啡背后的习惯。',
        ctaLabel: '',
        ctaUrl: '',
        image: 'assets/portfolio/奶咖记图文.png'
      },
      {
        title: '听谁的呀',
        status: 'live',
        description: '我是一间安静的调解室，专为两个人的分歧而亮起。你们可以各自说出立场、情绪与没被听见的理由，我会化身朋友、律师、心理咨询师或产品经理，替双方把混乱的争执梳理成清晰的脉络。最后给出一份公正而温和的判断：不急着分输赢，先让彼此重新听懂彼此。',
        signature: '@听谁的呀 小程序',
        summary: '让 AI 帮两个人温和地梳理分歧。',
        ctaLabel: '',
        ctaUrl: '',
        image: 'assets/portfolio/听谁的呀图片.png'
      },
      {
        title: '吃什么嘞',
        status: 'live',
        description: '我是一只替选择松绑的转盘。当天色落进饭点，而"吃什么"又变成一场小小的拉扯，你只需要把想吃的名字放进我的格子里：火锅、拉面、轻食、烧烤，或任何一份突然冒出来的念头。轻轻一转，犹豫被交给命运，答案带着一点随机的快乐落下。选择不必总是郑重，有时好好吃饭，就是最好的决定。',
        signature: '@吃什么嘞 小程序',
        summary: '把吃什么交给一只轻快的转盘。',
        ctaLabel: '',
        ctaUrl: '',
        image: 'assets/portfolio/今天吃什么图片.png'
      },
      {
        title: 'Next',
        status: 'coming-soon',
        description: '新的作品正在生长。',
        signature: '',
        summary: '新的作品正在生长。',
        ctaLabel: '',
        ctaUrl: '',
        image: '',
        placeholder: { title: '下一个作品', colors: ['#748d82', '#b7c6b9'] }
      },
      {
        title: 'Soon',
        status: 'coming-soon',
        description: '留给下一个产品的位置。',
        signature: '',
        summary: '留给下一个产品的位置。',
        ctaLabel: '',
        ctaUrl: '',
        image: '',
        placeholder: { title: '正在生长', colors: ['#bfcac3', '#eef3ef'] }
      }
    ];

    const ABOUT_TEXT = `产品经理，正在把AI当利剑闯江湖
vibe 出来的产品包括 KnowLens、吃什么嘞、听谁的呀、奶茶咖啡打卡日记（奶咖记）
用户数 5 个，包括我和我的朋友；收入 0 元
但我还是非常兴奋。如果你也能用上我们的产品，我会非常开心
我也会持续分享 AI 一手体验，用 AI build in public
如果你也想做自己的产品，想探索AI、副业和个人变现，欢迎关注我（小红书、抖音、视频号）

—— @麦克斯坦`;

    const productList = document.getElementById('productList');
    const detailOverlay = document.getElementById('detailOverlay');
    const detailBack = document.getElementById('detailBack');
    const detailNext = document.getElementById('detailNext');
    const detailImage = document.getElementById('detailImage');
    const detailStatus = document.getElementById('detailStatus');
    const detailTitle = document.getElementById('detailTitle');
    const detailDescription = document.getElementById('detailDescription');
    const detailSignature = document.getElementById('detailSignature');
    const detailCta = document.getElementById('detailCta');
    const aboutTab = document.getElementById('aboutTab');
    const aboutOverlay = document.getElementById('aboutOverlay');
    const aboutBack = document.getElementById('aboutBack');
    const aboutContent = document.getElementById('aboutContent');

    let currentIndex = 0;

    const liveProducts = PRODUCTS
      .map((p, i) => ({ product: p, index: i }))
      .filter(e => e.product.status === 'live');

    PRODUCTS.forEach((product, index) => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.addEventListener('click', () => openDetail(index));

      if (product.image) {
        const img = document.createElement('img');
        img.className = 'product-card-image';
        img.src = product.image;
        img.alt = product.title;
        img.loading = 'lazy';
        card.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'product-card-placeholder';
        ph.style.setProperty('--placeholder-a', product.placeholder.colors[0]);
        ph.style.setProperty('--placeholder-b', product.placeholder.colors[1]);
        const span = document.createElement('span');
        span.textContent = product.placeholder.title;
        ph.appendChild(span);
        card.appendChild(ph);
      }

      const body = document.createElement('div');
      body.className = 'product-card-body';

      const header = document.createElement('div');
      header.className = 'product-card-header';

      const title = document.createElement('div');
      title.className = 'product-card-title';
      title.textContent = product.title;

      const status = document.createElement('div');
      status.className = 'product-card-status';
      status.textContent = product.status === 'live' ? 'Live' : 'Soon';

      header.append(title, status);

      const summary = document.createElement('div');
      summary.className = 'product-card-summary';
      summary.textContent = product.summary;

      body.append(header, summary);
      card.appendChild(body);
      productList.appendChild(card);
    });

    function openDetail(index) {
      currentIndex = index;
      const product = PRODUCTS[index];
      const isComingSoon = product.status === 'coming-soon';

      detailImage.src = product.image || '';
      detailImage.alt = product.title;
      detailImage.style.display = product.image ? '' : 'none';
      detailStatus.textContent = isComingSoon ? 'Coming Soon' : 'Live Product';
      detailTitle.textContent = product.title;
      detailDescription.textContent = product.description;
      detailSignature.textContent = isComingSoon ? '' : (product.signature || '');

      if (!isComingSoon && product.ctaUrl) {
        detailCta.textContent = product.ctaLabel || '立即体验';
        detailCta.href = product.ctaUrl;
        detailCta.classList.remove('hidden');
      } else {
        detailCta.classList.add('hidden');
      }

      detailOverlay.classList.add('open');
      detailOverlay.scrollTop = 0;
    }

    function closeDetail() {
      detailOverlay.classList.remove('open');
    }

    function nextProduct() {
      const currentLiveIdx = liveProducts.findIndex(e => e.index === currentIndex);
      const nextLiveIdx = (currentLiveIdx + 1) % liveProducts.length;
      openDetail(liveProducts[nextLiveIdx].index);
    }

    detailBack.addEventListener('click', closeDetail);
    detailNext.addEventListener('click', nextProduct);

    aboutTab.addEventListener('click', () => {
      aboutContent.textContent = ABOUT_TEXT;
      aboutOverlay.classList.add('open');
      aboutTab.classList.add('is-active');
    });

    aboutBack.addEventListener('click', () => {
      aboutOverlay.classList.remove('open');
      aboutTab.classList.remove('is-active');
    });
  </script>
</body>
</html>
